name: KNX firmware

# Builds the WLED + KNX_IP firmware for the QuinLED Dig-Next-2 and publishes
# the .bin files as a GitHub Release ("knx-latest") for easy download.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - dig-next-2-knx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install PlatformIO
        run: pip install -r requirements.txt
      - name: Use KNX build configuration
        run: cp usermods/KNX_IP/platformio_override_KNX_IP.ini platformio_override.ini
      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}
      - name: Collect binaries
        run: |
          mkdir -p out
          cp .pio/build/${{ matrix.environment }}/firmware.bin out/${{ matrix.environment }}.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: out/*.bin

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result != 'cancelled'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: package.json
      - name: List files
        run: ls -la dist
      - name: Read WLED version
        id: ver
        run: echo "wled=$(jq -r .version src/package.json)" >> "$GITHUB_OUTPUT"
      - name: Remove outdated assets from the knx-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view knx-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for a in $(gh release view knx-latest -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
              [ -f "dist/$a" ] || gh release delete-asset knx-latest "$a" -R "$GITHUB_REPOSITORY" -y
            done
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: knx-latest
          name: KNX firmware (latest build of ${{ github.ref_name }})
          prerelease: true
          make_latest: false
          files: dist/*.bin
          body: |
            WLED ${{ steps.ver.outputs.wled }} + KNX_IP, automatisch gebaut aus `${{ github.ref_name }}` (${{ github.sha }}).
            - dig-next-2-knx.bin – QuinLED Dig-Next-2
            Update ueber WLED: Einstellungen -> Security & Updates -> Manual OTA Update.
