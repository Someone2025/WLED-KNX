[platformio]
# KNX build configuration for this fork: only the QuinLED Dig-Next-2 is built.
# Copy this file to the repository root as platformio_override.ini, then: pio run -e dig-next-2-knx
default_envs = dig-next-2-knx

[env]
; Keep custom ESP32 envs aligned with the stock esp32dev flash mode.
; The pinned Tasmota platform package ships dio/qio bootloaders, not dout.
board_build.flash_mode = dio

#
# QuinLED Dig-Next-2 (2 data outputs, 3 switchable DC outputs, 5-48V)
# Pinout: https://quinled.info/dig-next-2-pinout-guide/
#   LED data: GPIO2, GPIO4 | buttons: GPIO34, GPIO35 (HW debounced, pulled high)
#   internal DC relays: GPIO21 = 10A_1, GPIO20 = 5A_1, GPIO22 = 5A_2 | external relay trigger: GPIO5
#   QuinLED: "without [the relays] configured there will be no output power"
# No AudioReactive (microphone unused).
#
[env:dig-next-2-knx]
board = esp32dev
platform = ${esp32.platform}
platform_packages = ${esp32.platform_packages}
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32.build_flags}
  -D WLED_BRAND="\"QuinLED\""
  -D WLED_PRODUCT_NAME="\"Dig-Next-2-KNX\""
  -D SERVERNAME="\"Dig-Next-2-KNX\""
  -D WLED_RELEASE_NAME="\"Dig-Next-2-KNX\""
  -D DATA_PINS=2,4
  -D LED_TYPES=TYPE_WS2805,TYPE_WS2805
  -D PIXEL_COUNTS=14,14
  -D ABL_MILLIAMPS_DEFAULT=6000
  -D BTNPIN=34,35
  -D BTNTYPE=BTN_TYPE_PUSH,BTN_TYPE_PUSH
  -D RLYPIN=-1
  -D IRPIN=-1
  -D MULTI_RELAY_MAX_RELAYS=4
  -D MULTI_RELAY_PINS=21,20,22,5
  -D USERMOD_KNX_IP
lib_deps = ${esp32.lib_deps}
monitor_filters = esp32_exception_decoder
board_build.partitions = ${esp32.default_partitions}
extra_scripts = ${scripts_defaults.extra_scripts}
custom_usermods = KNX_IP multi_relay
